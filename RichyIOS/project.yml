# XcodeGen spec for the native Richy iOS app.
#   brew install xcodegen && xcodegen generate && open Richy.xcodeproj
# The generated Richy.xcodeproj and Info.plist are gitignored; this file is
# the source of truth for the project. See README.md for the Mac checklist.
name: Richy

options:
  bundleIdPrefix: com.richy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.15+ needs swift-tools-version 6.1, i.e. Xcode 16.4 or newer. On an
    # older Xcode replace this line with:   exactVersion: "12.14.0"
    from: "12.0.0"

targets:
  Richy:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Components
      - path: Models
      - path: Services
      - path: DesignSystem
      - path: Utilities
      - path: Resources/Assets.xcassets
      # Not committed. Register the iOS app (bundle id com.richy.app) in the
      # Firebase console and drop the downloaded file here; without it the
      # app runs in demo mode and explains what is missing.
      - path: Resources/GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    entitlements:
      path: Richy.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    postBuildScripts:
      # Same script as the committed Richy.xcodeproj: registers the sign-in
      # URL scheme(s) from GoogleService-Info.plist in the built Info.plist.
      - name: Register sign-in URL scheme
        shell: /bin/sh
        script: |
          CONFIG="${SRCROOT}/Resources/GoogleService-Info.plist"
          TARGET="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          PB=/usr/libexec/PlistBuddy
          if [ ! -f "$CONFIG" ] || [ ! -f "$TARGET" ]; then exit 0; fi
          REVERSED=$($PB -c "Print :REVERSED_CLIENT_ID" "$CONFIG" 2>/dev/null || true)
          APPID=$($PB -c "Print :GOOGLE_APP_ID" "$CONFIG" 2>/dev/null || true)
          ENCODED=""
          if [ -n "$APPID" ]; then ENCODED="app-$(echo "$APPID" | tr ':' '-')"; fi
          $PB -c "Delete :CFBundleURLTypes" "$TARGET" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$TARGET"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$TARGET"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$TARGET"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$TARGET"
          I=0
          for S in "$REVERSED" "$ENCODED"; do
            if [ -n "$S" ]; then
              $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:$I string $S" "$TARGET"
              I=$((I+1))
            fi
          done
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Richy
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richy.app
        PRODUCT_NAME: Richy
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_STYLE: Automatic
