<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Richy</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#8970C6"/>
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Richy"/>
<meta name="description" content="Personal budgeting, made calm. A beautiful budget paired with Richard, an AI advisor who knows your numbers."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&display=swap" rel="stylesheet"/>
<style>
  /* Display/title stack for "big titles". GT Alpina is a licensed Grilli Type
     face with no free CDN - it is named first so dropping licensed .woff2
     files into /fonts and adding an @font-face block later needs no other
     change. Fraunces (Google Fonts) is the free stand-in until then. Hebrew
     text isn't covered by either, so the stack still ends in the system UI
     fonts - RTL titles fall through to those, not to a mismatched Latin serif. */
  :root{--font-display:"GT Alpina","Fraunces",Georgia,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
  html,body,#root{margin:0;background:#F7F3EE;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  /* Boot-failure screen. Hidden until something goes wrong before React mounts.
     This is the only UI a user can reach when the bundle itself won't run, and
     in the native shell there is no address bar or pull-to-refresh behind it -
     so it has to carry its own way out. */
  #err{display:none;position:fixed;inset:0;background:#F7F3EE;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,system-ui,sans-serif;}
  html.rc-dark #err{background:#131110;}
  #err .rc-err-in{text-align:center;max-width:340px;}
  #err .rc-err-logo{width:56px;height:56px;border-radius:18px;background:#0D0C18;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
  #err .rc-err-logo span{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:700;color:#C8973A;line-height:1;}
  #err h1{font-size:19px;font-weight:800;color:#1A1410;margin:0 0 8px;}
  #err p{font-size:13.5px;line-height:1.5;color:#6E6259;margin:0 0 18px;}
  html.rc-dark #err h1{color:#F2EDE6;}
  html.rc-dark #err p{color:#B0A396;}
  #err button{border:none;cursor:pointer;background:#C8973A;color:#fff;font-size:14.5px;font-weight:700;padding:12px 28px;border-radius:12px;font-family:inherit;}
  /* Native launch splash: painted by the browser the instant HTML arrives, long
     before the app bundle is fetched and parsed. React replaces it on mount. */
  .rc-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif;}
  .rc-splash-in{text-align:center;}
  .rc-splash-logo{width:64px;height:64px;border-radius:20px;background:#0D0C18;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(0,0,0,0.18);animation:rcSplashBreathe 2.2s ease-in-out infinite;}
  .rc-splash-logo span{font-family:Georgia,'Times New Roman',serif;font-size:40px;font-weight:700;color:#C8973A;line-height:1;transform:translateY(2px);}
  .rc-splash-name{font-size:19px;font-weight:800;letter-spacing:-0.02em;color:#1A1410;margin-top:18px;opacity:0;animation:rcSplashIn 0.6s ease 0.15s forwards;}
  html.rc-dark .rc-splash-name{color:#F2EDE6;}
  .rc-splash-dots{margin-top:14px;display:flex;justify-content:center;gap:4px;opacity:0;animation:rcSplashIn 0.6s ease 0.3s forwards;}
  .rc-splash-dots i{width:5px;height:5px;border-radius:50%;background:#B0A396;animation:rcSplashDot 1.15s ease-in-out infinite;}
  .rc-splash-dots i:nth-child(2){animation-delay:0.16s}
  .rc-splash-dots i:nth-child(3){animation-delay:0.32s}
  @keyframes rcSplashBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
  @keyframes rcSplashIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes rcSplashDot{0%,60%,100%{transform:translateY(0);opacity:0.35}30%{transform:translateY(-4px);opacity:1}}
</style>
<script>
// Paint the saved look BEFORE the bundle loads: dark background (mirrors the
// cb_dark key written by rememberLook()) and text direction (cb_lang mirror,
// so Hebrew/Arabic users never see the UI flash left-to-right on boot).
(function () {
  try {
    if (localStorage.getItem("cb_dark") === "1") {
      var bg = "#131110";
      document.documentElement.style.background = bg;
      document.documentElement.classList.add("rc-dark");
      var setBody = function () { document.body.style.background = bg; };
      if (document.body) setBody(); else document.addEventListener("DOMContentLoaded", setBody);
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute("content", bg);
    }
    var lang = localStorage.getItem("cb_lang");
    if (lang === "he" || lang === "ar") document.documentElement.dir = "rtl";
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root">
  <div class="rc-splash">
    <div class="rc-splash-in">
      <div class="rc-splash-logo"><span>R</span></div>
      <div class="rc-splash-name">Richy</div>
      <div class="rc-splash-dots"><i></i><i></i><i></i></div>
    </div>
  </div>
</div>
<div id="err">
  <div class="rc-err-in">
    <div class="rc-err-logo"><span>R</span></div>
    <h1>Richy couldn't start</h1>
    <p id="err-msg">Something went wrong while loading. Your data is safe — nothing has been lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</div>
<script>
// Register the service worker: reminder notifications + the offline shell cache.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}
</script>
<!-- EVERY script below is same-origin, copied out of node_modules at deploy time
     by build.mjs (see its "Vendor the browser runtime" step). They were third-
     party CDN tags until we found that a single CDN failure left the app unable
     to boot at all - permanently on iOS, where Capacitor's capacitor:// scheme
     means the service worker never runs and nothing is ever cached. Keep them
     local: it is what makes the app launch offline and what makes our App Store
     Guideline 2.5.2 answer ("no code downloaded at runtime") true.
     Versions are pinned in package.json, not here. -->
<!-- Firebase (compat build exposes a global "firebase"). Firebase Auth owns
     sign-in and Firestore is the database; its security rules authorize on
     request.auth, which Firebase Auth populates directly. -->
<script src="/vendor/firebase-app-compat.js?v=__RICHY_BUILD__"></script>
<script src="/vendor/firebase-auth-compat.js?v=__RICHY_BUILD__"></script>
<script src="/vendor/firebase-firestore-compat.js?v=__RICHY_BUILD__"></script>
<script src="/firebase-init.js?v=__RICHY_BUILD__"></script>
<!-- React. -->
<script src="/vendor/react.production.min.js?v=__RICHY_BUILD__"></script>
<script src="/vendor/react-dom.production.min.js?v=__RICHY_BUILD__"></script>
<!-- The app, precompiled at deploy time by build.mjs. No Babel, no eval. -->
<script src="/dist/app.js?v=__RICHY_BUILD__"></script>
<script>
(function () {
  function fail(msg) {
    var box = document.getElementById("err");
    if (!box) return;
    if (msg) { var m = document.getElementById("err-msg"); if (m) m.textContent = msg; }
    var root = document.getElementById("root");
    if (root) root.style.display = "none";
    box.style.display = "flex";
  }
  // React and ReactDOM are same-origin now, so this should be unreachable - but
  // an unreachable branch that renders a Try again button costs nothing, and the
  // alternative is the user staring at a frozen splash with no way forward.
  if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
    fail("Richy couldn't load part of itself. Check your connection and try again.");
    return;
  }
  var App = window.RichyApp;
  var Boundary = window.RichyErrorBoundary;
  if (!App) { fail(); return; }
  try {
    var tree = Boundary
      ? React.createElement(Boundary, null, React.createElement(App))
      : React.createElement(App);
    ReactDOM.createRoot(document.getElementById("root")).render(tree);
  } catch (e) {
    try { console.error("Richy failed to mount:", e); } catch (e2) {}
    fail();
  }
})();
</script>
</body>
</html>
