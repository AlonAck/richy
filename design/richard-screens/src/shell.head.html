<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<helmet>
  <link rel="stylesheet" href="_ds/classical-8c9c94ce-c944-456d-ba51-95c18d5072b6/styles.css">
  <script src="_ds/classical-8c9c94ce-c944-456d-ba51-95c18d5072b6/_ds_bundle.js"></script>
  <meta name="design_doc_mode" content="page">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
  <style>
    /* ---- Tokens. Light is the base; every value has a dark pair below. ----
       Palette: Lavender #CED9EA, Wisteria Blue #89A3CB, Glaucous #6581AB.
       All three are light, so none of them sets text. Text uses darker members
       of the same family, sized against the Lavender ground, not white. */
    :root {
      color-scheme: light;
      --r-ground:#CED9EA;
      --r-card:#FFFFFF;
      --r-track:#B8C8DF;

      --r-ink:#111823;
      --r-ink-body:#2C3644;
      --r-ink-2:#38424F;
      --r-ink-3:#434E5E;
      --r-ink-muted:#4E5766;

      --r-accent:#6581AB;
      --r-accent-deep:#3F5980;
      --r-accent-text:#375074;
      --r-accent-tint:rgba(137,163,203,0.34);
      --r-accent-wash:rgba(137,163,203,0.18);
      --r-focus:#375074;

      --r-quiet:#6E7C93;
      --r-ready:#3F8A68; --r-ready-text:#2B6B4E;

      --r-btn:#33507C;
      --r-btn-hover:#3F5F8E;
      --r-btn-press:#4B6D9E;
      --r-on-btn:#F4F7FB;

      --r-border:#ADBFD8;
      --r-border-strong:#93A9C8;
      --r-hairline:#C4D2E5;
      --r-neutral-fill:rgba(17,24,35,0.07);
      --r-hover-fill:rgba(17,24,35,0.06);

      --r-bar:linear-gradient(90deg,#89A3CB,#3F5980);
      --r-shadow:0 1px 2px rgba(17,24,35,0.06);

      --r-serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
      --r-ease:cubic-bezier(.25,.1,.25,1);
    }

    /* Dark pair. Applies when the host asks for it, or when the OS does and the
       host has not pinned light. Every pair below was checked for contrast. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --r-ground:#141A24;
      --r-card:#1C2431;
      --r-track:#2C3849;
      --r-ink:#EAEFF7;
      --r-ink-body:#D5DEEB;
      --r-ink-2:#C3CEDE;
      --r-ink-3:#AEBBCD;
      --r-ink-muted:#93A1B5;
      --r-accent:#89A3CB;
      --r-accent-deep:#A6BCDE;
      --r-accent-text:#BACDE9;
      --r-accent-tint:rgba(137,163,203,0.22);
      --r-accent-wash:rgba(137,163,203,0.12);
      --r-focus:#A6BCDE;
      --r-quiet:#8896AB;
      --r-ready:#5FBF92; --r-ready-text:#5FBF92;
      --r-btn:#CED9EA;
      --r-btn-hover:#BCC9DE;
      --r-btn-press:#A6B6CF;
      --r-on-btn:#141A24;
      --r-border:rgba(255,255,255,0.13);
      --r-border-strong:rgba(255,255,255,0.21);
      --r-hairline:rgba(255,255,255,0.09);
      --r-neutral-fill:rgba(255,255,255,0.08);
      --r-hover-fill:rgba(255,255,255,0.07);
      --r-bar:linear-gradient(90deg,#6581AB,#89A3CB);
      --r-shadow:0 1px 2px rgba(0,0,0,0.34);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --r-ground:#141A24;
        --r-card:#1C2431;
        --r-track:#2C3849;
        --r-ink:#EAEFF7;
        --r-ink-body:#D5DEEB;
        --r-ink-2:#C3CEDE;
        --r-ink-3:#AEBBCD;
        --r-ink-muted:#93A1B5;
        --r-accent:#89A3CB;
        --r-accent-deep:#A6BCDE;
        --r-accent-text:#BACDE9;
        --r-accent-tint:rgba(137,163,203,0.22);
        --r-accent-wash:rgba(137,163,203,0.12);
        --r-focus:#A6BCDE;
        --r-quiet:#8896AB;
        --r-ready:#5FBF92; --r-ready-text:#5FBF92;
        --r-btn:#CED9EA;
        --r-btn-hover:#BCC9DE;
        --r-btn-press:#A6B6CF;
        --r-on-btn:#141A24;
        --r-border:rgba(255,255,255,0.13);
        --r-border-strong:rgba(255,255,255,0.21);
        --r-hairline:rgba(255,255,255,0.09);
        --r-neutral-fill:rgba(255,255,255,0.08);
        --r-hover-fill:rgba(255,255,255,0.07);
        --r-bar:linear-gradient(90deg,#6581AB,#89A3CB);
        --r-shadow:0 1px 2px rgba(0,0,0,0.34);
      }
    }

    /* ---- Base ---- */
    *, *::before, *::after { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--r-ground);
      color:var(--r-ink);
      -webkit-font-smoothing:antialiased;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    }
    ::selection { background:var(--r-accent-tint); color:var(--r-ink); }
    a { color:var(--r-accent-deep); text-decoration:none; }
    a:hover { text-decoration:underline; }
    a:focus-visible { outline:2px solid var(--r-focus); outline-offset:2px; border-radius:3px; }
    /* Transform-only entrance: a renderer that freezes animations (offscreen
       thumbnails, throttled tabs) still shows the page, just unshifted. */
    @keyframes riseUp { from { transform:translateY(12px); } to { transform:translateY(0); } }

    /* ---- Layout ---- */
    .r-page {
      min-height:100vh;
      min-height:100dvh;
      padding:clamp(36px,6vw,64px) clamp(20px,4.5vw,40px) clamp(64px,8vw,104px);
      background:var(--r-ground);
      color:var(--r-ink);
    }
    .r-shell { max-width:1040px; margin:0 auto; animation:riseUp .45s var(--r-ease) both; }
    .r-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-bottom:24px; margin-bottom:clamp(32px,4.4vw,48px); border-bottom:1px solid var(--r-border); }
    .r-head-name { flex:1; min-width:0; }
    .r-cols { display:grid; grid-template-columns:minmax(0,1.02fr) minmax(0,0.98fr); gap:clamp(28px,4.4vw,52px); align-items:stretch; margin-bottom:24px; }
    .r-cols-side { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:start; }
    /* The decision card is full shell width. One column of 62ch copy inside it
       left half the card empty, so the standing rule moved into a real second
       column instead of sitting under the buttons as a full-width strip. */
    .r-decide { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:clamp(28px,4.4vw,48px); align-items:stretch; }
    .r-decide-side { display:flex; flex-direction:column; gap:24px; }
    .r-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .r-decide-side .r-actions { margin-top:auto; }
    .r-rule { padding:20px; border-radius:10px; background:var(--r-accent-wash); border:1px solid var(--r-accent-tint); }
    .r-rule p { font-size:14.5px; line-height:1.55; color:var(--r-ink-body); margin:0; }

    /* ---- Type ---- */
    .r-h1 { font-family:var(--r-serif); font-size:clamp(34px,6vw,58px); line-height:1.06; font-weight:500; letter-spacing:-0.018em; margin:0 0 24px; text-wrap:balance; }
    .r-h2 { font-family:var(--r-serif); font-size:clamp(25px,3.4vw,34px); font-weight:600; letter-spacing:-0.015em; line-height:1.16; margin:0 0 16px; text-wrap:balance; }
    .r-h-section { font-family:var(--r-serif); font-size:clamp(20px,2.4vw,24px); font-weight:600; letter-spacing:-0.012em; margin:0 0 16px; text-wrap:balance; }
    .r-h-section-next { margin-top:32px; }
    .r-h-kicker { font-size:11px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase; color:var(--r-ink-muted); margin:0 0 16px; }

    /* ---- Surfaces. Flat, bordered, barely lifted. ---- */
    .r-card { background:var(--r-card); border:1px solid var(--r-border); border-radius:12px; box-shadow:var(--r-shadow); }
    .r-chip { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:var(--r-card); border:1px solid var(--r-border); font-size:13px; font-weight:500; }
    .r-tag { display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; }
    .r-logo { display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:var(--r-neutral-fill); color:var(--r-ink); flex:none; }
    .r-logo svg { display:block; width:21px; height:21px; }
    .r-logo path { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .r-avatar { display:flex; align-items:center; justify-content:center; border-radius:999px; background:var(--r-neutral-fill); color:var(--r-ink-3); font-weight:600; flex:none; }
    .r-list { display:flex; flex-direction:column; }
    .r-row { padding:16px 20px; border-top:1px solid var(--r-hairline); }
    .r-row:first-child { border-top:none; }

    /* ---- Buttons. Claude leads with the near-black action, not the accent. ---- */
    .r-btn {
      display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
      padding:12px 22px; min-height:44px; border-radius:10px;
      font-family:inherit; font-size:15px; font-weight:500; letter-spacing:-0.005em; cursor:pointer;
      transition:background-color .18s var(--r-ease), border-color .18s var(--r-ease), color .18s var(--r-ease), opacity .18s var(--r-ease);
    }
    .r-btn:focus-visible { outline:2px solid var(--r-focus); outline-offset:2px; }
    .r-btn-primary { border:1px solid transparent; background:var(--r-btn); color:var(--r-on-btn); }
    .r-btn-primary:hover { background:var(--r-btn-hover); }
    .r-btn-primary:active { background:var(--r-btn-press); }
    .r-btn-secondary { border:1px solid var(--r-border-strong); background:transparent; color:var(--r-ink-body); }
    .r-btn-secondary:hover { background:var(--r-hover-fill); }
    .r-btn-secondary:active { background:var(--r-neutral-fill); }
    .r-btn[disabled] { cursor:not-allowed; opacity:0.45; }

    /* ---- Data marks. Each one encodes a number already stated in the copy. ---- */
    .r-seg { display:flex; gap:5px; }
    .r-seg span { flex:1; height:12px; border-radius:4px; }
    .r-seg span.on { background:var(--r-accent); }
    .r-seg span.out { background:var(--r-track); border:1.5px dashed var(--r-quiet); }
    .r-stat { display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:14.5px; padding:10px 0; border-top:1px solid var(--r-hairline); }
    .r-stat b { font-weight:500; color:var(--r-ink-body); }
    .r-stat span { font-weight:600; font-variant-numeric:tabular-nums; }
    .r-slim { height:4px; border-radius:999px; background:var(--r-track); overflow:hidden; margin-top:10px; }
    .r-slim i { display:block; height:100%; border-radius:999px; }

    /* The branch graph. Small and dense on purpose — a wide sparse version of
       this reads as a doodle. Capped at 300px so it never scales its strokes
       up; colours match the dots in the list beneath, which names each line. */
    .r-graph { display:block; width:100%; max-width:340px; height:auto; }
    .r-graph path { fill:none; stroke-linecap:round; }
    .r-g-main { stroke:var(--r-ink-muted); stroke-width:2.2; }
    .r-g-open { stroke:var(--r-quiet); stroke-width:1.8; }
    .r-g-merge { stroke:var(--r-ready); stroke-width:2.2; }
    .r-graph circle.open { fill:var(--r-card); stroke:var(--r-quiet); stroke-width:1.6; }
    .r-graph circle.dot { fill:var(--r-ready); }
    .r-graph circle.commit { fill:var(--r-ink-muted); }
    .r-lede-foot { margin-top:24px; }
    @media (min-width:881px) {
      .r-lede-foot { margin-top:auto; padding-top:20px; border-top:1px solid var(--r-border); }
    }
    .r-graphrow { display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:20px; align-items:center; }
    .r-key { display:flex; flex-direction:column; gap:12px; }
    .r-key div { display:flex; align-items:center; gap:10px; font-size:12.5px; line-height:1.4; color:var(--r-ink-muted); }
    .r-key i { width:9px; height:9px; border-radius:999px; flex:none; }
    .r-key i.merged { background:var(--r-ready); }
    .r-key i.open { background:var(--r-card); border:1.6px solid var(--r-quiet); }
    @media (max-width:620px) { .r-graphrow { grid-template-columns:minmax(0,1fr); } }

    /* ---- Responsive ---- */
    @media (max-width:880px) {
      .r-cols, .r-cols-side, .r-decide { grid-template-columns:minmax(0,1fr); }
      .r-h1 br { display:none; }
    }
    @media (max-width:560px) {
      /* Two-column grid: the chip drops to its own row and lines up under the
         name on its own, with no magic indent to keep in step with the avatar. */
      .r-head { display:grid; grid-template-columns:38px minmax(0,1fr); column-gap:12px; row-gap:14px; align-items:center; }
      .r-head-chip { grid-column:2; justify-self:start; }
      .r-btn { width:100%; }
    }

    /* ---- Accessibility preferences ---- */
    @media (prefers-reduced-motion: reduce) {
      .r-shell { animation:none; }
      .r-btn { transition:none; }
    }
    @media (prefers-contrast: more) {
      :root { --r-ink-muted:var(--r-ink-3); --r-border:var(--r-border-strong); --r-hairline:var(--r-border-strong); }
      .r-btn-secondary { border-width:2px; border-color:currentColor; }
      .r-btn:focus-visible { outline-width:3px; }
    }

    /* ---- Page-specific: this chief's own data mark ---- */
{{PAGE_CSS}}
  </style>
</helmet>
